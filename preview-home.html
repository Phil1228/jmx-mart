<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>吉新成汽车出口商城 · 首页预览（近似）</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;}
  body{background:#ddd;display:flex;justify-content:center;padding:20px;}
  .phone{width:375px;height:780px;background:#f5f6f8;overflow:hidden;position:relative;border-radius:28px;border:8px solid #111;display:flex;flex-direction:column;}
  .topbar{display:flex;align-items:center;padding:10px 14px;background:linear-gradient(180deg,#e8f1ff,#f5f9ff);}
  .top-logo{width:34px;height:34px;border-radius:8px;background:#c8102e;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;}
  .top-title{flex:1;margin-left:10px;font-size:17px;font-weight:700;color:#1a1a1a;}
  .city{display:flex;align-items:center;font-size:13px;color:#444;background:#fff;padding:5px 12px;border-radius:20px;}
  .searchbar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#f5f9ff;}
  .search-input{flex:1;display:flex;align-items:center;background:#fff;border-radius:20px;padding:9px 14px;color:#aaa;font-size:13px;}
  .brand-btn{background:#c8102e;color:#fff;font-size:13px;font-weight:600;padding:9px 16px;border-radius:20px;}
  .content{flex:1;overflow:auto;padding-bottom:20px;}
  .dual-card{display:flex;gap:12px;padding:14px;}
  .card{flex:1;background:#fff;border-radius:12px;padding:14px;position:relative;height:120px;}
  .card-title{font-size:15px;font-weight:700;color:#1a1a1a;}
  .card-illu{position:absolute;right:8px;bottom:6px;width:90px;height:60px;background:#dfe7f5;border-radius:8px;}
  .section{padding:0 14px;margin-top:6px;}
  .section-head{display:flex;justify-content:space-between;align-items:center;margin:12px 0 8px;}
  .section-title{font-size:16px;font-weight:700;}
  .section-more{font-size:12px;color:#999;}
  .banner{border-radius:12px;padding:16px;position:relative;overflow:hidden;height:120px;margin-bottom:6px;}
  .banner-blue{background:#1a6fe0;}
  .banner-tag{display:inline-block;background:#c8102e;color:#fff;font-size:11px;padding:2px 8px;border-radius:5px;}
  .banner-count{color:#fff;font-size:12px;margin-top:6px;opacity:.9;}
  .banner-title{color:#fff;font-size:18px;font-weight:800;margin-top:4px;}
  .banner-illu{position:absolute;right:6px;bottom:0;width:130px;height:90px;background:rgba(255,255,255,.25);border-radius:8px;}
  .banner-light{background:#e8f1ff;height:110px;}
  .welfare-title{color:#1a3a6e;font-size:17px;font-weight:800;}
  .welfare-sub{color:#4a6a9e;font-size:12px;margin-top:6px;}
  .goods-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
  .goods-card{width:calc(50% - 6px);background:#fff;border-radius:12px;padding:9px;}
  .goods-img{width:100%;height:120px;background:#f5f7fa;border-radius:8px;}
  .goods-brand{font-size:11px;color:#999;margin-top:6px;}
  .goods-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .goods-price{color:#c8102e;margin-top:4px;}
  .price-num{font-size:16px;font-weight:800;}
  .price-unit{font-size:11px;}
  .tabbar{position:absolute;left:0;right:0;bottom:0;height:60px;display:flex;background:#fff;border-top:1px solid #eee;}
  .tab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#666;font-size:11px;}
  .tab-item .ico{font-size:22px;}
  .tab-item.active{color:#c8102e;font-weight:700;}
</style>
</head>
<body>
<div class="phone">
  <div class="topbar">
    <div class="top-logo">吉</div>
    <div class="top-title">吉新成汽车出口商城</div>
    <div class="city">深圳 ›</div>
  </div>
  <div class="searchbar">
    <div class="search-input">🔍 搜索品牌、车型、价格</div>
    <div class="brand-btn">品牌找车</div>
  </div>
  <div class="content">
    <div class="dual-card">
      <div class="card"><div class="card-title">特价新车</div><div class="card-illu"></div></div>
      <div class="card"><div class="card-title">严选二手车</div><div class="card-illu"></div></div>
    </div>
    <div class="section">
      <div class="section-head"><span class="section-title">热门活动</span><span class="section-more">更多 ›</span></div>
      <div class="banner banner-blue">
        <div class="banner-tag">进行中</div>
        <div class="banner-count">倒计时 02:13:45</div>
        <div class="banner-title">新车团购节 · 直降 3 万</div>
        <div class="banner-illu"></div>
      </div>
    </div>
    <div class="section">
      <div class="section-head"><span class="section-title">超值福利</span><span class="section-more">更多 ›</span></div>
      <div class="banner banner-light">
        <div class="welfare-title">0 元试驾 · 瓜分万元礼包</div>
        <div class="welfare-sub">下单即送保养券 + 车载好礼</div>
        <div class="banner-illu"></div>
      </div>
    </div>
    <div class="section">
      <div class="section-head"><span class="section-title">特卖车源</span><span class="section-more">品牌｜条件选车 ›</span></div>
      <div class="goods-grid">
        <div class="goods-card"><div class="goods-img"></div><div class="goods-brand">丰田</div><div class="goods-name">凯美瑞 2024款 2.0L</div><div class="goods-price"><span class="price-num">¥15.8</span><span class="price-unit">万起</span></div></div>
        <div class="goods-card"><div class="goods-img"></div><div class="goods-brand">比亚迪</div><div class="goods-name">汉EV 冠军版</div><div class="goods-price"><span class="price-num">¥18.9</span><span class="price-unit">万起</span></div></div>
        <div class="goods-card"><div class="goods-img"></div><div class="goods-brand">本田</div><div class="goods-name">雅阁 锐·T动</div><div class="goods-price"><span class="price-num">¥16.2</span><span class="price-unit">万起</span></div></div>
        <div class="goods-card"><div class="goods-img"></div><div class="goods-brand">特斯拉</div><div class="goods-name">Model 3 后驱</div><div class="goods-price"><span class="price-num">¥23.2</span><span class="price-unit">万起</span></div></div>
      </div>
    </div>
  </div>
  <div class="tabbar">
    <div class="tab-item active"><div class="ico">🏠</div>首页</div>
    <div class="tab-item"><div class="ico">🎁</div>活动福利</div>
    <div class="tab-item"><div class="ico">🚗</div>二手车</div>
    <div class="tab-item"><div class="ico">👤</div>我的</div>
  </div>
</div>
</body>
</html>
